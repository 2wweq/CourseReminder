
name: Build CourseReminder

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/CourseReminder.sln

      - name: Build
        run: dotnet build src/CourseReminder.sln -c Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish src/CourseReminder/CourseReminder.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish

      - name: Package ZIP
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "dev"
          }

          $zipName = "CourseReminder-$version-win-x64.zip"

          Compress-Archive -Path publish/* `
            -DestinationPath $zipName

          Write-Host "Package created: $zipName"

      - name: Calculate SHA256
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "CourseReminder-*-win-x64.zip" |
            Select-Object -First 1

          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()

          "$hash  $($zip.Name)" |
            Out-File SHA256SUMS.txt -Encoding ascii

          Get-Content SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CourseReminder-win-x64
          path: |
            CourseReminder-*-win-x64.zip
            SHA256SUMS.txt
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CourseReminder-*-win-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
